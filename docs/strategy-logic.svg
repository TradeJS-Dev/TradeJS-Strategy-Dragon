<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Bullish and bearish Dragon pattern logic</title>
  <desc id="desc">Four pivot Dragon reversal patterns confirmed by a break of the projected head-to-hump trendline.</desc>
  <rect width="1200" height="520" rx="24" fill="#0f172a" />
  <g font-family="Inter, system-ui, sans-serif">
    <text x="60" y="58" fill="#f8fafc" font-size="30" font-weight="700">Dragon reversal geometry</text>
    <text x="60" y="90" fill="#94a3b8" font-size="17">Four confirmed pivots plus a projected trendline break</text>

    <g transform="translate(60 120)">
      <rect width="520" height="340" rx="18" fill="#111c31" stroke="#24324a" />
      <text x="24" y="40" fill="#4ade80" font-size="20" font-weight="700">Bullish Dragon · LONG</text>
      <path d="M 54 72 L 190 262 L 326 190 L 404 238 L 476 126" fill="none" stroke="#a855f7" stroke-width="5" stroke-linejoin="round" />
      <line x1="54" y1="72" x2="476" y2="214" stroke="#3b82f6" stroke-width="4" stroke-dasharray="10 8" />
      <line x1="406" y1="242" x2="476" y2="126" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow-green)" />
      <g fill="#f8fafc" font-size="15" font-weight="600">
        <text x="34" y="58">head</text>
        <text x="154" y="292">front foot</text>
        <text x="306" y="174">hump</text>
        <text x="374" y="270">rear foot</text>
        <text x="430" y="108">break</text>
      </g>
      <g fill="#f59e0b">
        <circle cx="54" cy="72" r="7" /><circle cx="190" cy="262" r="7" /><circle cx="326" cy="190" r="7" /><circle cx="404" cy="238" r="7" />
      </g>
    </g>

    <g transform="translate(620 120)">
      <rect width="520" height="340" rx="18" fill="#111c31" stroke="#24324a" />
      <text x="24" y="40" fill="#fb7185" font-size="20" font-weight="700">Bearish Dragon · SHORT</text>
      <path d="M 54 270 L 190 80 L 326 152 L 404 104 L 476 216" fill="none" stroke="#a855f7" stroke-width="5" stroke-linejoin="round" />
      <line x1="54" y1="270" x2="476" y2="128" stroke="#3b82f6" stroke-width="4" stroke-dasharray="10 8" />
      <line x1="406" y1="100" x2="476" y2="216" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-red)" />
      <g fill="#f8fafc" font-size="15" font-weight="600">
        <text x="34" y="298">head</text>
        <text x="154" y="68">front foot</text>
        <text x="306" y="176">hump</text>
        <text x="374" y="90">rear foot</text>
        <text x="430" y="240">break</text>
      </g>
      <g fill="#f59e0b">
        <circle cx="54" cy="270" r="7" /><circle cx="190" cy="80" r="7" /><circle cx="326" cy="152" r="7" /><circle cx="404" cy="104" r="7" />
      </g>
    </g>
  </g>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#22c55e" /></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ef4444" /></marker>
  </defs>
</svg>
